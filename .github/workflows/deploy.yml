# .github/workflows/deploy.yml — GitHub Pages 自动部署（DESIGN.md 7.2 节）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true          # 保留旧文件，避免部署窗口404
          force_orphan: false        # 明确禁用孤儿推送
